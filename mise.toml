# Configuración de tareas de LyraFlow mediante Mise
# Reutiliza el estándar común: dev, build, release, publish

[tasks.dev]
raw_args = true
description = "Ejecutar LyraFlow; variantes 'isolated' para varias instancias o 'android' para móvil"
file = "scripts/mise-task.ts"

[tasks.build]
raw_args = true
description = "Compilar ejecutable Desktop o APK de Android ('mise build' o 'mise build android')"
file = "scripts/mise-task.ts"

[tasks.release]
raw_args = true
description = "Generar instalador oficial Inno Setup en release/ sin publicar"
file = "scripts/mise-task.ts"

[tasks.check]
raw_args = true
description = "Verificar compilación Desktop y Android; 'desktop' comprueba solo escritorio"
file = "scripts/mise-task.ts"

[tasks.test]
raw_args = true
description = "Ejecutar pruebas de escritorio; 'scripts' verifica herramientas de tareas y empaquetado"
file = "scripts/mise-task.ts"

[tasks.publish]
raw_args = true
description = "Publicar release en GitHub y sincronizar ficha en Aurora (--plan y --check sin escritura)"
file = "scripts/mise-task.ts"
