<!doctype html>
<html lang="es" data-tema="claro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acerca de · Componente del ecosistema Biglex</title>
    <link rel="stylesheet" href="acercada.css" />
  </head>
  <body>
    <div class="prototipo">
      <header class="prototipo-cabecera">
        <div>
          <h1>Componente «Acerca de»</h1>
          <p>Tres presentaciones del mismo contenido, con los datos reales de LyraFlow.</p>
        </div>
        <div class="controles">
          <label>
            Modo
            <select id="tema">
              <option value="claro">Claro</option>
              <option value="oscuro">Oscuro</option>
            </select>
          </label>
          <label>
            Actualizaciones
            <select id="estado">
              <option value="aldia">Al día</option>
              <option value="nueva">Nueva versión</option>
            </select>
          </label>
        </div>
      </header>

      <main id="raiz"></main>
    </div>

    <script src="acercada.js"></script>
  </body>
</html>
