# Configuración de tareas de LyraFlow mediante Mise (rama Rust + GPUI)
# Reutiliza el estándar común: dev, build, check, test (release/publish en main/preview)

[tasks.dev]
raw_args = true
description = "Ejecutar LyraFlow GPUI en desarrollo desde native/"
file = "scripts/mise-task.ts"

[tasks.build]
raw_args = true
description = "Compilar binario nativo Rust + GPUI en modo release"
file = "scripts/mise-task.ts"

[tasks.release]
raw_args = true
description = "No disponible en la rama GPUI (instalador oficial en main/preview)"
file = "scripts/mise-task.ts"

[tasks.check]
raw_args = true
description = "Verificar el paquete Rust + GPUI (cargo check --locked)"
file = "scripts/mise-task.ts"

[tasks.test]
raw_args = true
description = "Ejecutar pruebas de Rust + GPUI o 'scripts' para utilidades"
file = "scripts/mise-task.ts"

[tasks.publish]
raw_args = true
description = "No disponible en la rama GPUI (publicación oficial en main/preview)"
file = "scripts/mise-task.ts"
